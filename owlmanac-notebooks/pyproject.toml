[project]
name = "owlmanac-notebooks"
version = "0.0.0"
description = "Owlmanac's marimo notebooks: a folder per post, producing its data or being the post itself, and notebooks that only explore."
requires-python = ">=3.12"
dependencies = [
    # Pinned: a notebook post's export runs this marimo's frontend, which loads the same marimo in Pyodide.
    "marimo==0.25.2",
    "altair",
    "astropy",
    "astropy-healpix",
    "astroquery",
    "pandas",
    "polars",
    "pyarrow",
]

[tool.uv]
package = false

# Follow the reader's theme; inside a post, the export makes this follow the site's theme switch.
[tool.marimo.display]
theme = "system"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

# Lint and format checks (CI runs them), with Ruff's defaults but for marimo's conventions.
[tool.ruff]
# A post's column fits about 80 characters of code, and marimo wraps longer lines, losing their indentation.
line-length = 79

[tool.ruff.lint]
# Two of marimo's own conventions read as mistakes to Ruff: a cell ends with `return` (PLR1711), and a
# cell's last bare expression is what it displays (B018).
ignore = ["PLR1711", "B018"]
