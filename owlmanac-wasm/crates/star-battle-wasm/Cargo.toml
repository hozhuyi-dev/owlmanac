[package]
name = "star-battle-wasm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1"
serde-wasm-bindgen = "0.6"
star-battle = { path = "../star-battle" }
wasm-bindgen = "0.2"

# Where `npm run wasm` puts the package, relative to owlmanac-web: shared, as two posts use it.
[package.metadata.owlmanac]
out = "src/wasm/star-battle"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
