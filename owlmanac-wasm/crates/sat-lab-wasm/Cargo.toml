[package]
name = "sat-lab-wasm"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sat-core = { path = "../sat-core" }
serde = "1"
serde-wasm-bindgen = "0.6"
sudoku = { path = "../sudoku" }
wasm-bindgen = "0.2"

# Where `npm run wasm` puts the package, relative to owlmanac-web.
[package.metadata.owlmanac]
out = "src/content/posts/from-brute-force-to-cdcl/wasm"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
