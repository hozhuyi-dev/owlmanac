name: Deploy

# A push to main runs every check (ci.yml), then builds the site and deploys it to GitHub Pages. Nothing
# deploys unless every check passes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      # npm run build exports notebook posts with marimo, through uv.
      - uses: astral-sh/setup-uv@v6
      - uses: withastro/action@v6
        with:
          path: ./owlmanac-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
